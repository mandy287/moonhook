name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check toolchain
        run: moon version --all

      - name: Check
        run: moon check --target all

      - name: Test
        run: moon test --target all

      - name: Build native demo
        run: moon build --target native

      - name: Verify formatting and interfaces
        shell: bash
        run: |
          moon fmt
          moon info
          git diff --exit-code
